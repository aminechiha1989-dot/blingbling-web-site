<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLINGBLING ACCESSOIRES — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110F;
    --cream:#F3ECDF;
    --cream-2:#EAE1CE;
    --wine:#6B1E3C;
    --live:#FF3B6E;
    --gold:#B9925A;
    --line: rgba(20,17,15,0.12);
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream); color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 24px;}

  header{ border-bottom:1px solid var(--line); padding:22px 0; }
  header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .logo{ font-family:var(--font-display); font-size:22px; font-weight:600; }
  .logo em{font-style:italic; font-weight:300;}
  .logo-sub{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--wine); margin-top:2px;}
  .logout-btn{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    background:none; border:1px solid var(--ink); padding:8px 14px; border-radius:2px; cursor:pointer;
  }
  .logout-btn:hover{background:var(--ink); color:var(--cream);}

  /* ---------- login gate ---------- */
  .login-screen{
    max-width:380px; margin:120px auto; padding:40px 32px;
    background:#fff; border:1px solid var(--line); border-radius:4px;
  }
  .login-screen h1{font-family:var(--font-display); font-size:26px; margin-bottom:8px;}
  .login-screen p{font-size:14px; color:rgba(20,17,15,.65); margin-bottom:24px; line-height:1.5;}
  .login-screen input{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:2px;
    font-family:var(--font-mono); font-size:14px; margin-bottom:14px; background:var(--cream);
  }
  .login-screen button{
    width:100%; padding:13px; border:1px solid var(--ink); background:var(--ink); color:var(--cream);
    font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em;
    border-radius:2px; cursor:pointer;
  }
  .login-screen button:hover{background:var(--wine); border-color:var(--wine);}
  .login-error{color:var(--live); font-size:13px; margin-top:10px; display:none;}
  .login-error.open{display:block;}

  /* ---------- main app ---------- */
  #app{display:none;}
  .section-title{
    font-family:var(--font-display); font-size:24px; font-weight:600; margin:36px 0 18px;
  }

  /* ---------- add/edit form ---------- */
  .form-card{
    background:#fff; border:1px solid var(--line); border-radius:4px; padding:26px;
    margin-bottom:36px;
  }
  .form-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:rgba(20,17,15,.6);}
  .field input, .field textarea, .field select{
    padding:11px 12px; border:1px solid var(--line); border-radius:2px;
    font-family:var(--font-body); font-size:14px; background:var(--cream);
  }
  .field.checkbox{flex-direction:row; align-items:center; gap:8px;}
  .field.checkbox input{width:auto;}
  .form-actions{display:flex; gap:12px; margin-top:18px;}
  .btn{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    padding:12px 22px; border-radius:2px; border:1px solid var(--ink);
    background:var(--ink); color:var(--cream); cursor:pointer;
  }
  .btn:hover{background:var(--wine); border-color:var(--wine);}
  .btn.ghost{background:transparent; color:var(--ink);}
  .btn.ghost:hover{background:var(--ink); color:var(--cream);}
  .form-msg{font-size:13px; margin-top:12px;}
  .form-msg.error{color:var(--live);}
  .form-msg.success{color:#2e7d32;}

  /* ---------- product list ---------- */
  .products-table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .products-table th{
    text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color:rgba(20,17,15,.55); padding:12px 14px; border-bottom:1px solid var(--line);
    background:var(--cream-2);
  }
  .products-table td{padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  .products-table tr:last-child td{border-bottom:none;}
  .prod-thumb{width:44px; height:44px; border-radius:3px; object-fit:cover; background:var(--cream-2); display:block;}
  .prod-name{font-weight:600;}
  .live-toggle{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; padding:5px 10px;
    border-radius:2px; border:1px solid var(--line); background:var(--cream); cursor:pointer;
  }
  .live-toggle.on{background:var(--live); color:#fff; border-color:var(--live);}
  .row-actions{display:flex; gap:8px;}
  .row-actions button{
    font-family:var(--font-mono); font-size:11px; padding:6px 10px; border-radius:2px;
    border:1px solid var(--line); background:#fff; cursor:pointer;
  }
  .row-actions button.delete:hover{background:var(--live); border-color:var(--live); color:#fff;}
  .row-actions button.edit:hover{background:var(--ink); border-color:var(--ink); color:var(--cream);}
  .empty-state{padding:40px; text-align:center; color:rgba(20,17,15,.55); font-size:14px;}
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <h1>Admin</h1>
  <p>Entre ta clé d'administration pour gérer les produits de Blingbling Accessoires.</p>
  <input type="password" id="admin-key-input" placeholder="Clé admin (ADMIN_KEY)">
  <button id="login-btn">Se connecter</button>
  <div class="login-error" id="login-error">Clé invalide ou serveur injoignable.</div>
</div>

<div id="app">
  <header>
    <div class="wrap">
      <div>
        <div class="logo">BLINGBLING <em>ACCESSOIRES</em></div>
        <div class="logo-sub">Espace admin</div>
      </div>
      <button class="logout-btn" id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <div class="wrap">
    <h2 class="section-title" id="form-title">Ajouter un produit</h2>
    <div class="form-card">
      <form id="product-form">
        <input type="hidden" id="p-id">
        <div class="form-grid">
          <div class="field full">
            <label>Nom du produit</label>
            <input type="text" id="p-name" required>
          </div>
          <div class="field full">
            <label>Description</label>
            <textarea id="p-description" rows="2"></textarea>
          </div>
          <div class="field full">
            <label>Photo (URL) — héberge-la sur imgbb.com ou Cloudinary, puis colle le lien ici</label>
            <input type="url" id="p-image" placeholder="https://...">
          </div>
          <div class="field">
            <label>Prix (DT)</label>
            <input type="number" id="p-price" step="0.001" min="0" required>
          </div>
          <div class="field">
            <label>Stock</label>
            <input type="number" id="p-stock" min="0" required>
          </div>
          <div class="field">
            <label>Catégorie</label>
            <input type="text" id="p-category" placeholder="Bijoux, Sacs, Prêt-à-porter...">
          </div>
          <div class="field checkbox">
            <input type="checkbox" id="p-live">
            <label style="text-transform:none; font-size:13px;">Badge « vu en live »</label>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="submit-btn">Ajouter le produit</button>
          <button type="button" class="btn ghost" id="cancel-edit-btn" style="display:none;">Annuler</button>
        </div>
        <div class="form-msg" id="form-msg"></div>
      </form>
    </div>

    <h2 class="section-title">Produits (<span id="prod-count">0</span>)</h2>
    <table class="products-table" id="products-table">
      <thead>
        <tr>
          <th>Photo</th><th>Nom</th><th>Prix</th><th>Stock</th><th>Catégorie</th><th>Live</th><th></th>
        </tr>
      </thead>
      <tbody id="products-tbody"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">Aucun produit pour l'instant — ajoute le premier ci-dessus.</div>
  </div>
</div>

<script>
  const API_BASE = 'https://blingbling-b7cg.onrender.com';

  let adminKey = localStorage.getItem('bb_admin_key') || '';
  let products = [];
  let editingId = null;

  const loginScreen = document.getElementById('login-screen');
  const app = document.getElementById('app');
  const loginError = document.getElementById('login-error');

  function adminHeaders(extra = {}) {
    return Object.assign({ 'Authorization': `Bearer ${adminKey}` }, extra);
  }

  function formatPrice(millimes){
    return (millimes / 1000).toFixed(3).replace(/0+$/,'').replace(/\.$/,'') + ' DT';
  }

  async function tryLogin(key){
    adminKey = key;
    try{
      // DELETE sur un id inexistant (0) : passe par requireAdmin d'abord.
      // 401 = mauvaise clé. 404 = clé valide (juste "produit introuvable").
      const res = await fetch(`${API_BASE}/api/products/0`, { method: 'DELETE', headers: adminHeaders() });
      if(res.status === 401){
        loginError.classList.add('open');
        return;
      }
      localStorage.setItem('bb_admin_key', adminKey);
      loginError.classList.remove('open');
      showApp();
    }catch(err){
      loginError.classList.add('open');
    }
  }

  function showApp(){
    loginScreen.style.display = 'none';
    app.style.display = 'block';
    loadProducts();
  }

  document.getElementById('login-btn').addEventListener('click', () => {
    const key = document.getElementById('admin-key-input').value.trim();
    if(key) tryLogin(key);
  });
  document.getElementById('admin-key-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('bb_admin_key');
    adminKey = '';
    app.style.display = 'none';
    loginScreen.style.display = 'block';
  });

  async function loadProducts(){
    try{
      const res = await fetch(`${API_BASE}/api/products`);
      products = await res.json();
      renderTable();
    }catch(err){
      document.getElementById('products-tbody').innerHTML = '';
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('empty-state').textContent = 'Impossible de charger les produits.';
    }
  }

  function renderTable(){
    const tbody = document.getElementById('products-tbody');
    document.getElementById('prod-count').textContent = products.length;
    if(products.length === 0){
      tbody.innerHTML = '';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }
    document.getElementById('empty-state').style.display = 'none';
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.image_url ? `<img class="prod-thumb" src="${p.image_url}" alt="">` : `<div class="prod-thumb"></div>`}</td>
        <td class="prod-name">${p.name}</td>
        <td>${formatPrice(p.price_millimes)}</td>
        <td>${p.stock}</td>
        <td>${p.category || '—'}</td>
        <td><button class="live-toggle ${p.is_live ? 'on' : ''}" data-id="${p.id}">${p.is_live ? 'En live' : 'Off'}</button></td>
        <td>
          <div class="row-actions">
            <button class="edit" data-id="${p.id}">Modifier</button>
            <button class="delete" data-id="${p.id}">Suppr.</button>
          </div>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.live-toggle').forEach(btn => {
      btn.addEventListener('click', () => toggleLive(Number(btn.dataset.id)));
    });
    tbody.querySelectorAll('.edit').forEach(btn => {
      btn.addEventListener('click', () => editProduct(Number(btn.dataset.id)));
    });
    tbody.querySelectorAll('.delete').forEach(btn => {
      btn.addEventListener('click', () => deleteProduct(Number(btn.dataset.id)));
    });
  }

  async function toggleLive(id){
    const product = products.find(p => p.id === id);
    if(!product) return;
    try{
      await fetch(`${API_BASE}/api/products/${id}`, {
        method: 'PATCH',
        headers: adminHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ is_live: product.is_live ? 0 : 1 }),
      });
      loadProducts();
    }catch(err){ alert("Impossible de mettre à jour le badge live."); }
  }

  function editProduct(id){
    const p = products.find(p => p.id === id);
    if(!p) return;
    editingId = id;
    document.getElementById('p-id').value = p.id;
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-description').value = p.description || '';
    document.getElementById('p-image').value = p.image_url || '';
    document.getElementById('p-price').value = (p.price_millimes / 1000);
    document.getElementById('p-stock').value = p.stock;
    document.getElementById('p-category').value = p.category || '';
    document.getElementById('p-live').checked = !!p.is_live;
    document.getElementById('form-title').textContent = 'Modifier le produit';
    document.getElementById('submit-btn').textContent = 'Enregistrer les modifications';
    document.getElementById('cancel-edit-btn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm(){
    editingId = null;
    document.getElementById('product-form').reset();
    document.getElementById('p-id').value = '';
    document.getElementById('form-title').textContent = 'Ajouter un produit';
    document.getElementById('submit-btn').textContent = 'Ajouter le produit';
    document.getElementById('cancel-edit-btn').style.display = 'none';
  }

  document.getElementById('cancel-edit-btn').addEventListener('click', resetForm);

  async function deleteProduct(id){
    if(!confirm('Supprimer ce produit ?')) return;
    try{
      await fetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE', headers: adminHeaders() });
      loadProducts();
    }catch(err){ alert('Impossible de supprimer le produit.'); }
  }

  document.getElementById('product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formMsg = document.getElementById('form-msg');
    formMsg.textContent = '';
    formMsg.className = 'form-msg';

    const payload = {
      name: document.getElementById('p-name').value.trim(),
      description: document.getElementById('p-description').value.trim(),
      image_url: document.getElementById('p-image').value.trim(),
      price_millimes: Math.round(parseFloat(document.getElementById('p-price').value) * 1000),
      stock: parseInt(document.getElementById('p-stock').value, 10),
      category: document.getElementById('p-category').value.trim(),
      is_live: document.getElementById('p-live').checked ? 1 : 0,
    };

    try{
      const url = editingId ? `${API_BASE}/api/products/${editingId}` : `${API_BASE}/api/products`;
      const method = editingId ? 'PATCH' : 'POST';
      const res = await fetch(url, {
        method,
        headers: adminHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if(!res.ok){
        formMsg.textContent = data.error || "Une erreur s'est produite.";
        formMsg.classList.add('error');
        return;
      }
      formMsg.textContent = editingId ? 'Produit mis à jour ✓' : 'Produit ajouté ✓';
      formMsg.classList.add('success');
      resetForm();
      loadProducts();
    }catch(err){
      formMsg.textContent = 'Impossible de contacter le serveur.';
      formMsg.classList.add('error');
    }
  });

  // auto-login si une clé est déjà enregistrée
  if(adminKey){
    tryLogin(adminKey);
  }
</script>

</body>
</html>
