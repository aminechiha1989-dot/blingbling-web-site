name: Garder le serveur Render réveillé
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Réveiller le serveur
        run: curl -s -o /dev/null -w "%{http_code} en %{time_total}s\n" -m 90 https://blingbling-b7cg.onrender.com/api/products || true
