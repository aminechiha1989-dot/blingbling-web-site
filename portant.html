<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Portant — Blingbling Accessoires</title>
<meta name="description" content="Découvrez les pièces Blingbling sur le portant : faites défiler, choisissez, commandez. Paiement à la livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#6B1E3C; --gold:#B9925A; --cream:#F3ECDF; --ink:#14110F; --live:#FF3B6E;
    --paper:#FAF8F5; --line:rgba(20,17,15,.12);
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-body);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  header a{color:inherit;text-decoration:none;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .brand{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:.02em;text-transform:none}
  .cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 12px 0}
  .cats button{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);border-radius:99px}
  .cats button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* --- Le portant --- */
  .stage{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:440px;touch-action:pan-y;user-select:none}
  .rail-svg{position:absolute;left:0;right:0;top:26px;width:100%;height:60px;pointer-events:none}
  .rack{position:relative;height:min(52vh,430px);margin-top:20px}
  .item{position:absolute;top:28px;left:50%;width:min(58vw,300px);height:calc(100% - 28px);margin-left:calc(min(58vw,300px) / -2);
    transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s;transform-origin:50% 0;cursor:pointer;will-change:transform}
  .item .hook{position:absolute;left:50%;top:-30px;width:2px;height:34px;background:#9a9a9a;transform:translateX(-50%)}
  .item .hook::before{content:"";position:absolute;left:-6px;top:-10px;width:14px;height:14px;border:2px solid #9a9a9a;border-bottom-color:transparent;border-radius:50%}
  .item img{width:100%;height:100%;object-fit:contain;object-position:50% 0;filter:drop-shadow(0 18px 14px rgba(0,0,0,.13));pointer-events:none}
  .item.side img{filter:drop-shadow(0 10px 8px rgba(0,0,0,.1))}
  .item.sway{animation:sway 1.1s ease-out}
  @keyframes sway{0%{rotate:0deg}25%{rotate:2.4deg}55%{rotate:-1.5deg}80%{rotate:.6deg}100%{rotate:0deg}}
  .floor{width:150px;height:12px;margin:6px auto 0;background:radial-gradient(closest-side,rgba(0,0,0,.16),transparent)}
  .caption{text-align:center;padding:6px 16px 18px}
  .caption h1{font-family:var(--font-display);font-weight:600;font-size:22px}
  .caption .meta{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;color:rgba(20,17,15,.6);margin:6px 0 12px;text-transform:uppercase}
  .pill{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink);border-radius:99px;padding:9px 18px}
  .pill:hover{background:var(--ink);color:var(--paper)}
  .arrow{position:absolute;top:45%;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:rgba(250,248,245,.85);font-size:18px;z-index:5}
  .arrow.prev{left:10px}.arrow.next{right:10px}
  .empty{text-align:center;padding:60px 24px;color:rgba(20,17,15,.6)}
  .strip{background:var(--wine);color:#fff;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;padding:9px 16px}

  /* --- Fiche produit --- */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,17,15,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;inset:auto 0 0 0;max-height:94vh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:21;display:grid}
  .sheet.open{transform:none}
  .sheet .close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);z-index:3}
  .gallery{position:relative;height:min(52vh,460px);background:var(--paper)}
  .gallery img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s}
  .gallery img.on{opacity:1}
  .gallery .g-arrow{position:absolute;top:50%;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.9);z-index:2}
  .gallery .g-prev{left:10px}.gallery .g-next{right:10px}
  .dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
  .dots i{width:14px;height:2px;background:rgba(20,17,15,.2)}.dots i.on{background:var(--ink)}
  .ai-note{position:absolute;left:10px;bottom:8px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.9);padding:3px 7px;border-radius:4px;display:none}
  .info{padding:18px 20px 26px}
  .info .cat{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(20,17,15,.55)}
  .info h2{font-family:var(--font-display);font-size:26px;font-weight:600;margin:4px 0}
  .info .price{font-family:var(--font-mono);font-size:16px;color:var(--wine)}
  .info .desc{font-size:14px;line-height:1.5;color:rgba(20,17,15,.75);margin:10px 0}
  .info .stock{font-family:var(--font-mono);font-size:11px;color:rgba(20,17,15,.55)}
  .qty{display:flex;align-items:center;gap:14px;margin:14px 0;font-family:var(--font-mono)}
  .qty button{width:34px;height:34px;border:1px solid var(--line);border-radius:50%}
  .cta{width:100%;background:var(--wine);color:#fff;border-radius:99px;padding:14px 18px;font-weight:600;display:flex;justify-content:space-between}
  .cta:disabled{opacity:.5}
  form{display:none;gap:10px;margin-top:14px}
  form.open{display:grid}
  form input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
  .msg{font-size:13px;margin-top:10px}.msg.err{color:#b3261e}.msg.ok{color:#1b6e3a;font-weight:600}
  .cod{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(20,17,15,.55);margin-top:10px;text-align:center}
  @media(min-width:860px){
    .sheet{inset:50% auto auto 50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;width:min(920px,94vw);border-radius:18px;grid-template-columns:1.1fr 1fr;transition:opacity .3s,transform .3s}
    .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
    .gallery{height:560px}
    .info{padding:44px 30px 30px}
  }
  @media(prefers-reduced-motion:reduce){.item,.sheet,.gallery img{transition:none}.item.sway{animation:none}}
</style>
</head>
<body>
<header>
  <a href="index.html">← Boutique</a>
  <a class="brand" href="index.html">Blingbling</a>
  <a href="https://www.tiktok.com/@amoulette.soltani" target="_blank" rel="noopener">TikTok</a>
</header>
<div class="cats" id="cats"></div>

<main class="stage" id="stage">
  <svg class="rail-svg" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="rg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3e3e3"/><stop offset=".5" stop-color="#a9a9a9"/><stop offset="1" stop-color="#d0d0d0"/></linearGradient></defs>
    <path d="M-20 8 Q500 58 1020 8" fill="none" stroke="url(#rg)" stroke-width="7" vector-effect="non-scaling-stroke"/>
  </svg>
  <button class="arrow prev" id="prev" aria-label="Pièce précédente">←</button>
  <button class="arrow next" id="next" aria-label="Pièce suivante">→</button>
  <div class="rack" id="rack"></div>
  <div class="floor"></div>
  <div class="caption" id="caption"></div>
</main>
<div class="strip"><span id="strip-left">Paiement à la livraison</span><span>Livraison partout en Tunisie</span></div>

<div class="sheet-bg" id="sheet-bg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-name">
  <button class="close" id="s-close" aria-label="Fermer">✕</button>
  <div class="gallery" id="gallery"></div>
  <div class="info">
    <div class="cat" id="s-cat"></div>
    <h2 id="s-name"></h2>
    <div class="price" id="s-price"></div>
    <p class="desc" id="s-desc"></p>
    <div class="stock" id="s-stock"></div>
    <div class="qty"><button id="q-minus" aria-label="Moins">−</button><span id="q-val">1</span><button id="q-plus" aria-label="Plus">+</button></div>
    <button class="cta" id="s-cta"><span>Commander</span><span id="s-total"></span></button>
    <form id="s-form" novalidate>
      <input id="f-name" placeholder="Nom et prénom" autocomplete="name" required>
      <input id="f-phone" placeholder="Téléphone" inputmode="tel" autocomplete="tel" required>
      <input id="f-city" placeholder="Ville" autocomplete="address-level2" required>
      <input id="f-address" placeholder="Adresse de livraison" autocomplete="street-address" required>
      <button class="cta" type="submit" id="f-submit"><span>Confirmer la commande</span><span id="f-total"></span></button>
    </form>
    <div class="msg" id="s-msg"></div>
    <div class="cod">Paiement à la livraison</div>
  </div>
</section>

<script>
(function(){
  const LOCAL = ['localhost','127.0.0.1'].includes(location.hostname);
  const API_BASE = (LOCAL && new URLSearchParams(location.search).get('api')) || 'https://blingbling-b7cg.onrender.com';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dt = m => (m/1000).toLocaleString('fr-FR',{minimumFractionDigits: m%1000?3:0}) + ' DT';
  const imgs = p => { try{ const l = JSON.parse(p.images||'[]'); if(Array.isArray(l)&&l.length) return l; }catch(e){} return p.image_url ? [p.image_url] : []; };

  let all = [], list = [], idx = 0, cat = '', current = null, qty = 1, gi = 0;

  async function load(){
    $('caption').innerHTML = '<div class="meta">Chargement du portant…</div>';
    try{
      const [pr, st] = await Promise.all([
        fetch(API_BASE + '/api/products').then(r => r.json()),
        fetch(API_BASE + '/api/site-settings').then(r => r.json()).catch(() => ({})),
      ]);
      const root = document.documentElement.style;
      if(st.color_wine) root.setProperty('--wine', st.color_wine);
      if(st.color_ink) root.setProperty('--ink', st.color_ink);
      all = (Array.isArray(pr) ? pr : []).filter(p => imgs(p).length);
      // Les pièces préparées au Studio (photo détourée) passent en premier.
      all.sort((a,b) => (b.images?1:0) - (a.images?1:0));
      buildCats(); applyCat('');
    }catch(e){
      $('rack').innerHTML = ''; $('caption').innerHTML = '<div class="empty">Impossible de charger les pièces. Réessaie dans un instant.</div>';
    }
  }

  function buildCats(){
    const names = [...new Set(all.map(p => p.category).filter(Boolean))];
    if(names.length < 2){ $('cats').innerHTML = ''; return; }
    $('cats').innerHTML = ['', ...names].map(n => `<button data-c="${esc(n)}">${esc(n || 'Tout')}</button>`).join('');
    $('cats').onclick = e => { const b = e.target.closest('button'); if(b) applyCat(b.dataset.c); };
  }
  function applyCat(c){
    cat = c; list = all.filter(p => !c || p.category === c); idx = 0;
    [...$('cats').children].forEach(b => b.classList.toggle('on', b.dataset.c === c));
    $('rack').innerHTML = list.map((p,i) => `<div class="item" data-i="${i}"><span class="hook"></span><img src="${esc(imgs(p)[0])}" alt="${esc(p.name)}" loading="lazy"></div>`).join('');
    render();
  }

  function render(sway){
    const n = list.length;
    if(!n){ $('caption').innerHTML = '<div class="empty">Aucune pièce sur le portant pour le moment.</div>'; return; }
    const step = Math.min(innerWidth * .36, 250);
    [...$('rack').children].forEach((el,i) => {
      let d = i - idx; if(n > 4){ if(d > n/2) d -= n; if(d < -n/2) d += n; }
      const a = Math.abs(d);
      const y = -a * a * 5;                     // suit la courbe du rail
      const sx = a ? .2 : 1, s = a ? .78 : 1;   // les pièces de côté sont vues de profil
      el.style.transform = `translate(${d*step}px,${y}px) scale(${s}) scaleX(${sx})`;
      el.style.opacity = a > 2 ? 0 : 1; el.style.pointerEvents = a > 2 ? 'none' : '';
      el.style.zIndex = 10 - a; el.classList.toggle('side', a > 0);
      if(sway){ el.classList.remove('sway'); void el.offsetWidth; el.classList.add('sway'); }
    });
    const p = list[idx];
    $('caption').innerHTML = `<h1>${esc(p.name)}</h1><div class="meta">${esc(p.category || 'Pièce')} · ${dt(p.price_millimes)}</div><button class="pill" id="open">Voir la pièce</button>`;
    $('open').onclick = () => openSheet(p);
    $('prev').style.display = $('next').style.display = n > 1 ? '' : 'none';
  }
  function go(d){ const n = list.length; if(n < 2) return; idx = (idx + d + n) % n; render(true); }

  $('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
  $('rack').onclick = e => { const it = e.target.closest('.item'); if(!it) return; const i = +it.dataset.i; if(i === idx) openSheet(list[idx]); else { idx = i; render(true); } };
  let sx = null;
  $('stage').addEventListener('pointerdown', e => sx = e.clientX);
  $('stage').addEventListener('pointerup', e => { if(sx === null) return; const dx = e.clientX - sx; sx = null; if(Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); });
  addEventListener('keydown', e => { if($('sheet').classList.contains('open')){ if(e.key === 'Escape') closeSheet(); if(e.key === 'ArrowRight') showG(gi+1); if(e.key === 'ArrowLeft') showG(gi-1); } else { if(e.key === 'ArrowRight') go(1); if(e.key === 'ArrowLeft') go(-1); } });
  addEventListener('resize', () => render());

  // --- Fiche produit ---
  function openSheet(p){
    current = p; qty = 1; gi = 0;
    const l = imgs(p);
    $('gallery').innerHTML = l.map((u,i) => `<img src="${esc(u)}" alt="${esc(p.name)} — photo ${i+1}">`).join('') +
      (l.length > 1 ? '<button class="g-arrow g-prev" aria-label="Photo précédente">←</button><button class="g-arrow g-next" aria-label="Photo suivante">→</button><div class="dots">' + l.map(() => '<i></i>').join('') + '</div>' : '') +
      '<span class="ai-note">Photo portée générée par IA</span>';
    $('s-cat').textContent = p.category || ''; $('s-name').textContent = p.name;
    $('s-price').textContent = dt(p.price_millimes); $('s-desc').textContent = p.description || '';
    $('s-stock').textContent = p.stock <= 3 ? `Plus que ${p.stock} en stock` : 'En stock';
    $('s-form').classList.remove('open'); $('s-cta').style.display = ''; $('s-msg').textContent = ''; $('s-msg').className = 'msg';
    showG(0); updQty();
    $('sheet').classList.add('open'); $('sheet-bg').classList.add('open'); $('s-close').focus();
  }
  function showG(i){
    const im = $('gallery').querySelectorAll('img'); if(!im.length) return;
    gi = (i + im.length) % im.length;
    im.forEach((el,k) => el.classList.toggle('on', k === gi));
    $('gallery').querySelectorAll('.dots i').forEach((el,k) => el.classList.toggle('on', k === gi));
    // Convention du Studio : la 1re photo est la vraie pièce détourée, les suivantes sont portées par un mannequin IA.
    const note = $('gallery').querySelector('.ai-note'); if(note) note.style.display = (current.images && gi > 0) ? 'block' : 'none';
  }
  $('gallery').onclick = e => { if(e.target.closest('.g-next')) showG(gi+1); else if(e.target.closest('.g-prev')) showG(gi-1); };
  function closeSheet(){ $('sheet').classList.remove('open'); $('sheet-bg').classList.remove('open'); }
  $('s-close').onclick = closeSheet; $('sheet-bg').onclick = closeSheet;
  function updQty(){ $('q-val').textContent = qty; const t = dt(current.price_millimes * qty); $('s-total').textContent = t; $('f-total').textContent = t; }
  $('q-minus').onclick = () => { qty = Math.max(1, qty-1); updQty(); };
  $('q-plus').onclick = () => { qty = Math.min(current.stock, qty+1); updQty(); };
  $('s-cta').onclick = () => { $('s-form').classList.add('open'); $('s-cta').style.display = 'none'; $('f-name').focus(); };
  $('s-form').onsubmit = async e => {
    e.preventDefault();
    const v = id => $(id).value.trim(), msg = $('s-msg');
    const body = { customer_name: v('f-name'), phone: v('f-phone'), city: v('f-city'), address: v('f-address'), payment_method: 'cod', items: [{ product_id: current.id, quantity: qty }] };
    if(!body.customer_name || !body.phone || !body.city || !body.address){ msg.textContent = 'Merci de remplir tous les champs.'; msg.className = 'msg err'; return; }
    $('f-submit').disabled = true; msg.textContent = 'Envoi…'; msg.className = 'msg';
    try{
      const res = await fetch(API_BASE + '/api/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Erreur');
      $('s-form').classList.remove('open');
      msg.textContent = `Commande #${data.id} enregistrée — on te contacte au ${body.phone} pour confirmer.`; msg.className = 'msg ok';
      current.stock -= qty;
    }catch(err){ msg.textContent = err.message || "Une erreur s'est produite, réessaie."; msg.className = 'msg err'; }
    $('f-submit').disabled = false;
  };

  load();
})();
</script>
</body>
</html>
